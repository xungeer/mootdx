name: GitHub Release

on:
  push:
    tags: ['v0.*']

permissions:
  contents: read
  actions: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'xungeer/mootdx'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful master CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          COMMIT_SHA=$(git rev-parse HEAD)
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$COMMIT_SHA" -f event=push -f per_page=100 > "$RUNNER_TEMP/ci-runs.json"
          python - "$RUNNER_TEMP/ci-runs.json" "$COMMIT_SHA" <<'PY'
          import json, sys
          runs = json.load(open(sys.argv[1]))['workflow_runs']
          matches = [r for r in runs if r['head_sha'] == sys.argv[2] and r['head_branch'] == 'master' and r['path'] == '.github/workflows/django.yml']
          assert matches, 'No master CI for tagged commit'
          latest = max(matches, key=lambda r: r['run_number'])
          assert latest['status'] == 'completed' and latest['conclusion'] == 'success', 'Tagged commit CI is not successful'
          PY
      - name: Build and verify versioned artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install uv==0.11.17
          uv build --out-dir dist
          python scripts/verify/verify_release_package.py --tag "$RELEASE_TAG" --dist dist --notes "$RUNNER_TEMP/release-notes.md"
          uv venv "$RUNNER_TEMP/mootdx-wheel"
          uv pip install --python "$RUNNER_TEMP/mootdx-wheel/bin/python" dist/*.whl
          uv pip check --python "$RUNNER_TEMP/mootdx-wheel/bin/python"
          "$RUNNER_TEMP/mootdx-wheel/bin/python" scripts/verify/verify_release_package.py --tag "$RELEASE_TAG" --installed
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "Mootdx $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
