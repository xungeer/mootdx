name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        run: python -m pip install uv==0.11.17
      - name: Restore locked test environment
        run: uv sync --locked --python '${{ matrix.python-version }}'
      - name: Run all offline tests
        run: uv run --locked pytest -ra

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.17
      - name: Restore locked runtime and documentation tool
        run: |
          uv sync --locked --python 3.12
          uv pip install --python .venv/bin/python -r docs/requirements.txt
      - name: Validate documentation
        run: .venv/bin/python scripts/verify/verify_docs.py --pre-release

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.17
      - name: Build and inspect release artifacts
        run: |
          uv build --out-dir dist
          python scripts/verify/verify_release_package.py --dist dist
      - name: Verify the standalone installed wheel
        run: |
          uv venv "$RUNNER_TEMP/mootdx-wheel"
          uv pip install --python "$RUNNER_TEMP/mootdx-wheel/bin/python" dist/*.whl
          uv pip check --python "$RUNNER_TEMP/mootdx-wheel/bin/python"
          "$RUNNER_TEMP/mootdx-wheel/bin/python" scripts/verify/verify_release_package.py --installed
